# Production overrides: HTTPS via Caddy, nothing else reachable from outside.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required in .env: DOMAIN, SECRET_KEY, DB_PASSWORD. See docs/deployment.md.
services:
  db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

  backend:
    restart: unless-stopped
    ports: !reset []
    environment:
      DATABASE_URL: postgresql+asyncpg://testharbor:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/testharbor
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      SECURE_COOKIES: "true"
      SEED_DEMO: ${SEED_DEMO:-false}

  frontend:
    restart: unless-stopped
    ports: !reset []

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on: [frontend]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. testharbor.example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
