[project]
name = "testharbor-backend"
version = "0.1.0"
description = "TestHarbor backend: test case management API"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "itsdangerous>=2.2",
    "defusedxml>=0.7.1",
    "argon2-cffi>=23.1",
    "httpx>=0.28",  # the MCP tools call the REST API in-process
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
# tests/fixtures holds sample suites used to generate JUnit reports; never collect them.
addopts = "--ignore=tests/fixtures"
