name: testharbor

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testharbor
      # Only applied when the database volume is first created.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testharbor}
      POSTGRES_DB: testharbor
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testharbor -d testharbor"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://testharbor:${DB_PASSWORD:-testharbor}@db:5432/testharbor
      TEST_DATABASE_URL: postgresql+asyncpg://testharbor:${DB_PASSWORD:-testharbor}@db:5432/testharbor_test
      SECRET_KEY: ${SECRET_KEY:-change-me-please}
      SEED_DEMO: ${SEED_DEMO:-true}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # Runs autotests from TestHarbor: a git branch of your test repository, picked when starting a run.
  # Setup: docs/runner.md (RUNNER_* in .env, the tests' .env in runner-secrets/tests.env), then `make runner`.
  runner:
    build:
      context: .
      dockerfile: deploy/runner/Dockerfile
    profiles: ["runner"]
    restart: unless-stopped
    ipc: host
    environment:
      TESTHARBOR_URL: http://backend:8000
      TESTHARBOR_TOKEN: ${RUNNER_TOKEN:-}
      TESTHARBOR_PROJECT: ${RUNNER_PROJECT:-}
      TESTHARBOR_REPO: ${RUNNER_REPO:-}
      TESTHARBOR_BRANCH: ${RUNNER_BRANCH:-}
      TESTHARBOR_REPO_PATH: ${RUNNER_REPO_PATH:-}
      TESTHARBOR_GIT_USER: ${RUNNER_GIT_USER:-}
      TESTHARBOR_GIT_TOKEN: ${RUNNER_GIT_TOKEN:-}
      TESTHARBOR_AGENT_NAME: ${RUNNER_NAME:-server}
      TESTHARBOR_WORKDIR: /work
      # Where people open the runs' HTML reports (served by the runner on port 9323).
      TESTHARBOR_REPORTS_URL: ${RUNNER_REPORTS_URL:-http://localhost:9323}
    ports:
      # Reports hold traces with the tests' session tokens: local only unless RUNNER_REPORTS_BIND says otherwise.
      - "${RUNNER_REPORTS_BIND:-127.0.0.1}:${RUNNER_REPORTS_PORT:-9323}:9323"
    volumes:
      - runner-work:/work
      - runner-cache:/root/.cache
      - ./runner-secrets:/secrets:ro
    depends_on:
      backend:
        condition: service_healthy

  # Playwright smoke tests: docker compose --profile e2e run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["e2e"]
    working_dir: /e2e
    ipc: host
    environment:
      BASE_URL: http://frontend:3000
      # Set by `make e2e`, which creates/updates this admin with a random password.
      E2E_EMAIL: ${E2E_EMAIL:-e2e-admin@testharbor.local}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
      E2E_OUTPUT_DIR: /tmp/test-results
      CI: "true"
    volumes:
      - ./frontend/e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    depends_on:
      frontend:
        condition: service_started
    command: sh -c "npm ci --no-audit --no-fund --loglevel=error && npx playwright test"

volumes:
  runner-work:
  runner-cache:
  db-data:
  e2e-node-modules:
