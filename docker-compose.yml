name: testharbor

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testharbor
      # Only applied when the database volume is first created.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testharbor}
      POSTGRES_DB: testharbor
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testharbor -d testharbor"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://testharbor:${DB_PASSWORD:-testharbor}@db:5432/testharbor
      TEST_DATABASE_URL: postgresql+asyncpg://testharbor:${DB_PASSWORD:-testharbor}@db:5432/testharbor_test
      SECRET_KEY: ${SECRET_KEY:-change-me-please}
      SEED_DEMO: ${SEED_DEMO:-true}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # Playwright smoke tests: docker compose --profile e2e run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["e2e"]
    working_dir: /e2e
    ipc: host
    environment:
      BASE_URL: http://frontend:3000
      # Set by `make e2e`, which creates/updates this admin with a random password.
      E2E_EMAIL: ${E2E_EMAIL:-e2e-admin@testharbor.local}
      E2E_PASSWORD: ${E2E_PASSWORD:-}
      E2E_OUTPUT_DIR: /tmp/test-results
      CI: "true"
    volumes:
      - ./frontend/e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    depends_on:
      frontend:
        condition: service_started
    command: sh -c "npm ci --no-audit --no-fund --loglevel=error && npx playwright test"

volumes:
  db-data:
  e2e-node-modules:
